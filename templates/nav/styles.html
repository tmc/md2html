{{define "nav-styles"}}
<style>
    /* Sticky bar above the layout: site name on the left, status right. */
    .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        height: var(--topbar-height);
        padding: 0 1.25rem;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: saturate(160%) blur(12px);
        -webkit-backdrop-filter: saturate(160%) blur(12px);
        border-bottom: 1px solid var(--line);
        font-size: 0.875rem;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .top-nav-left,
    .top-nav-right {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
    }

    .top-nav-title {
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text-1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Shown only where the sidebar collapses into a drawer. */
    .nav-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        color: var(--text-2);
        cursor: pointer;
    }

    .nav-toggle:hover { color: var(--text-1); border-color: var(--line-strong); }

    .nav-toggle-bars,
    .nav-toggle-bars::before,
    .nav-toggle-bars::after {
        display: block;
        width: 0.85rem;
        height: 1.5px;
        background: currentColor;
        border-radius: 1px;
    }

    .nav-toggle-bars {
        position: relative;
    }

    .nav-toggle-bars::before,
    .nav-toggle-bars::after {
        content: "";
        position: absolute;
    }

    .nav-toggle-bars::before { top: -4px; }
    .nav-toggle-bars::after { top: 4px; }

    .search-trigger {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.3rem 0.5rem 0.3rem 0.7rem;
        font: inherit;
        font-size: 0.8rem;
        color: var(--text-3);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        transition: border-color 0.12s ease, color 0.12s ease;
    }

    .search-trigger:hover {
        color: var(--text-1);
        border-color: var(--line-strong);
    }

    .search-trigger kbd {
        font-size: 0.68rem;
        padding: 0.05em 0.35em;
        border-bottom-width: 1px;
        color: var(--text-3);
    }

    .skip-link {
        position: absolute;
        left: 0.5rem;
        top: -3rem;
        z-index: 200;
        padding: 0.5rem 0.9rem;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-2);
        transition: top 0.15s ease;
    }

    .skip-link:focus {
        top: 0.5rem;
    }

    .top-nav-link {
        padding: 0.35rem 0.6rem;
        color: var(--text-2);
        border-radius: var(--radius-sm);
        font-weight: 500;
    }

    .top-nav-link:hover {
        color: var(--text-1);
        background: var(--surface-2);
    }

    /*
     * Three columns: navigation, the document, and its table of contents.
     * The whole grid is centered so the text does not drift to one side
     * on a wide display.
     */
    .docs-layout {
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--toc-width);
        --toc-width: 14rem;
        align-items: start;
        max-width: 100rem;
        margin: 0 auto;
    }

    .sidebar {
        position: sticky;
        top: var(--topbar-height);
        height: calc(100vh - var(--topbar-height));
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 1.75rem 1rem 3rem 1.5rem;
        border-right: 1px solid var(--line);
    }

    .sidebar-header {
        margin-bottom: 1.25rem;
    }

    .sidebar-header h1 {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
    }

    /* The sidebar repeats the site name the bar already shows. */
    .top-nav ~ .docs-layout .sidebar-header {
        display: none;
    }

    .site-nav {
        font-size: 0.875rem;
    }

    .nav-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .nav-group {
        font-weight: 600;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-3);
        margin: 1.75rem 0 0.4rem;
        padding: 0 0.6rem;
    }

    .nav-group:first-child { margin-top: 0; }

    .nav-sep hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 1rem 0;
        background: none;
        height: 0;
    }

    .nav-item { margin: 0; }

    .nav-item a {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.32rem 0.6rem;
        color: var(--text-2);
        border-radius: var(--radius-sm);
        line-height: 1.45;
        transition: color 0.12s ease, background 0.12s ease;
    }

    /* Icons are sized here rather than in the file: an icon set carries
       its own pixel dimensions, which are stripped on the way in so the
       sidebar decides the size. Without a size the SVG would fill the
       line box. */
    .nav-icon {
        display: inline-flex;
        flex: none;
        width: 1em;
        height: 1em;
        color: var(--text-3, var(--text-2));
    }

    .nav-icon svg {
        width: 100%;
        height: 100%;
        stroke-width: 2;
    }

    .nav-item a:hover .nav-icon,
    .nav-item a.active .nav-icon {
        color: inherit;
    }

    .nav-item a:hover {
        color: var(--text-1);
        background: var(--surface-2);
    }

    .nav-item a.active {
        color: var(--accent);
        background: var(--accent-soft);
        font-weight: 550;
    }

    /* Nested items sit under a guide rule rather than deeper padding. */
    .nav-item .nav-list {
        margin: 0.15rem 0 0.15rem 0.6rem;
        border-left: 1px solid var(--line);
        padding-left: 0.4rem;
    }

    .main-content {
        min-width: 0;
        padding: 3rem 3rem 6rem;
    }

    /* Keep prose to a readable measure, centered in a wide column. */
    .main-content > * {
        max-width: var(--measure);
        margin-inline: auto;
    }

    /* Only diagrams and wide media are allowed past the measure. */
    .main-content > .mermaid,
    .main-content > table {
        max-width: min(100%, calc(var(--measure) + 4rem));
    }

    .breadcrumb {
        font-size: 0.78rem;
        margin-bottom: 0.75rem;
        color: var(--text-3);
    }

    .breadcrumb ol {
        display: flex;
        flex-wrap: wrap;
        list-style: none;
        padding: 0;
        margin: 0;
        gap: 0.35rem;
    }

    .breadcrumb li {
        display: flex;
        align-items: center;
    }

    .breadcrumb li:not(:last-child)::after {
        content: '/';
        margin-left: 0.35rem;
        color: var(--line-strong);
    }

    .breadcrumb a { color: var(--text-3); }
    .breadcrumb a:hover { color: var(--text-1); }

    .breadcrumb li[aria-current="page"] {
        color: var(--text-2);
    }

    /* Previous and next page */
    .page-nav {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 4rem;
        padding-top: 2rem;
        border-top: 1px solid var(--line);
    }

    .page-nav a {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.85rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        min-width: 0;
        max-width: 48%;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .page-nav a:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-1);
    }

    .nav-prev { align-items: flex-start; }
    .nav-next { align-items: flex-end; margin-left: auto; text-align: right; }
    .nav-prev-empty { flex: 1; }

    .nav-label {
        font-size: 0.68rem;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .nav-title {
        font-size: 0.94rem;
        font-weight: 550;
        color: var(--text-1);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
    }

    .page-nav a:hover .nav-title { color: var(--accent); }

    /* Page footer */
    .page-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-top: 2.5rem;
        font-size: 0.82rem;
        color: var(--text-3);
    }

    .edit-link a, .edit-link {
        color: var(--text-3);
    }

    .edit-link a:hover, .edit-link:hover {
        color: var(--accent);
    }

    /* "On this page" */
    .sidebar-toc {
        position: sticky;
        top: var(--topbar-height);
        height: calc(100vh - var(--topbar-height));
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 3rem 1.5rem 3rem 0.5rem;
        font-size: 0.8rem;
    }

    .sidebar-toc-header {
        font-weight: 600;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-3);
        margin-bottom: 0.6rem;
        padding-left: 0.75rem;
    }

    .sidebar-toc ul {
        list-style: none;
        padding: 0;
        margin: 0;
        border-left: 1px solid var(--line);
    }

    .sidebar-toc li { margin: 0; }

    .sidebar-toc a {
        display: block;
        padding: 0.25rem 0 0.25rem 0.75rem;
        margin-left: -1px;
        color: var(--text-2);
        border-left: 1px solid transparent;
        line-height: 1.45;
        transition: color 0.12s ease, border-color 0.12s ease;
    }

    .sidebar-toc a:hover { color: var(--text-1); }

    .sidebar-toc a.active {
        color: var(--accent);
        border-left-color: var(--accent);
    }

    .sidebar-toc a.level-1 { padding-left: 0.75rem; }
    .sidebar-toc a.level-2 { padding-left: 0.75rem; }
    .sidebar-toc a.level-3 { padding-left: 1.6rem; color: var(--text-3); }

    /* A page with too few headings has no rail; do not reserve room. */
    .docs-layout:has(.sidebar-toc[hidden]),
    .docs-layout:has(.sidebar-toc[style*="display: none"]) {
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar-toc[hidden] { display: none; }

    /* The inline table of contents duplicates the rail. */
    .docs-layout .main-content #toc-title,
    .docs-layout .main-content #toc {
        display: none;
    }

    @media (max-width: 1120px) {
        .docs-layout {
            grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        }
        .sidebar-toc { display: none; }
        .main-content { padding: 2.5rem 2.5rem 5rem; }
    }

    /*
     * Narrow windows: the sidebar becomes a drawer opened from the bar,
     * so the document starts at the top of the screen instead of below a
     * screenful of links.
     */
    @media (max-width: 900px) {
        .docs-layout,
        .docs-layout:has(.sidebar-toc[hidden]) {
            grid-template-columns: minmax(0, 1fr);
        }

        .nav-toggle { display: inline-flex; }

        .sidebar {
            position: fixed;
            top: var(--topbar-height);
            left: 0;
            z-index: 90;
            width: min(20rem, 84vw);
            height: calc(100vh - var(--topbar-height));
            background: var(--bg);
            border-right: 1px solid var(--line);
            box-shadow: var(--shadow-2);
            transform: translateX(-102%);
            transition: transform 0.18s ease;
        }

        .sidebar.open { transform: translateX(0); }

        .nav-backdrop {
            position: fixed;
            inset: var(--topbar-height) 0 0;
            z-index: 80;
            background: rgba(0, 0, 0, 0.35);
        }

        .main-content { padding: 2rem 1.25rem 4rem; }
    }

    @media (max-width: 600px) {
        .page-nav { flex-direction: column; }
        .page-nav a { max-width: 100%; }
        .nav-next { align-items: flex-start; text-align: left; }
    }
</style>
{{end}}
