{{define "nav-styles"}}
<style>
    /* Sticky bar above the layout: site name on the left, status right. */
    /*
     * Three slots: the site name, the search field, and the links. The
     * outer columns are equal so the search sits on the centre of the
     * viewport rather than on the centre of whatever is left over, which
     * would move it every time a link appeared beside it.
     */
    .top-nav {
        display: grid;
        grid-template-columns: 1fr minmax(0, 26rem) 1fr;
        align-items: center;
        gap: 1rem;
        height: var(--topbar-height);
        /*
         * The bar itself is full-bleed for the background and border,
         * but its content is held to the same 100rem measure as the
         * layout below, and then inset by what the columns inset their
         * own text: the sidebar's padding plus a nav item's, so the site
         * name starts on the same vertical as the links under it, and
         * the table of contents' padding less the repository link's own,
         * so the two end on the same one. Without the insets the bar's
         * ends sit a dozen pixels outside every column on the page.
         */
        padding-left: calc(max(0px, (100% - 100rem) / 2) + 2.1rem);
        padding-right: calc(max(0px, (100% - 100rem) / 2) + 0.9rem);
        /* Enough of the page shows through to say the document runs on
           under the bar, and no more: at a wider blur the words scrolling
           past smear into a shape that reads as a smudge on the glass. */
        background: color-mix(in srgb, var(--bg) 93%, transparent);
        backdrop-filter: saturate(130%) blur(6px);
        -webkit-backdrop-filter: saturate(130%) blur(6px);
        border-bottom: 1px solid var(--line);
        font-size: 0.875rem;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .top-nav-left,
    .top-nav-right {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
    }

    .top-nav-right { justify-self: end; }

    .top-nav-center {
        display: flex;
        justify-content: center;
        min-width: 0;
    }

    .top-nav-title {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-decoration: none;
    }

    .top-nav-title:hover { color: var(--text-1); }

    .top-nav-link {
        font-size: 0.86rem;
        font-weight: 500;
        color: var(--text-2);
        text-decoration: none;
        white-space: nowrap;
    }

    .top-nav-link:hover { color: var(--text-1); }

    .theme-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: none;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--text-2);
        cursor: pointer;
    }

    .theme-toggle:hover {
        color: var(--text-1);
        background: var(--surface-2);
    }

    .theme-toggle svg { width: 1.1rem; height: 1.1rem; }

    /* The button shows the theme a click switches to: the moon while
       light is shown, the sun while dark is. Which is shown follows the
       same conditions that pick the dark design tokens. */
    .theme-toggle-sun { display: none; }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .theme-toggle-sun { display: block; }
        :root:not([data-theme="light"]) .theme-toggle-moon { display: none; }
    }
    :root[data-theme="dark"] .theme-toggle-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle-moon { display: none; }

    /* A star with no count is noise; the element stays for the browser
       refresh to fill, and appears once it holds a number. */
    .repo-link-stars:has(.repo-link-count:empty) { display: none; }

    /* Shown only where the sidebar collapses into a drawer. */
    .nav-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        color: var(--text-2);
        cursor: pointer;
    }

    .nav-toggle:hover { color: var(--text-1); border-color: var(--line-strong); }

    .nav-toggle-bars,
    .nav-toggle-bars::before,
    .nav-toggle-bars::after {
        display: block;
        width: 0.85rem;
        height: 1.5px;
        background: currentColor;
        border-radius: 1px;
    }

    .nav-toggle-bars {
        position: relative;
    }

    .nav-toggle-bars::before,
    .nav-toggle-bars::after {
        content: "";
        position: absolute;
    }

    .nav-toggle-bars::before { top: -4px; }
    .nav-toggle-bars::after { top: 4px; }

    /*
     * A field, not a button: it is the width of the thing it searches, so
     * it reads as somewhere to type rather than as one more control
     * crowded in beside the links.
     */
    .search-trigger {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        width: 100%;
        height: 2.25rem;
        padding: 0 0.6rem 0 0.75rem;
        font: inherit;
        font-size: 0.85rem;
        color: var(--text-3);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        cursor: pointer;
        text-align: left;
        transition: border-color 0.12s ease, color 0.12s ease;
    }

    .search-trigger-icon {
        width: 0.95rem;
        height: 0.95rem;
        flex: none;
    }

    .search-trigger-label { flex: 1; min-width: 0; }

    .search-trigger:hover {
        color: var(--text-1);
        border-color: var(--line-strong);
    }

    .search-trigger kbd {
        font-size: 0.68rem;
        padding: 0.05em 0.35em;
        border-bottom-width: 1px;
        color: var(--text-3);
    }

    .skip-link {
        position: absolute;
        left: 0.5rem;
        top: -3rem;
        z-index: 200;
        padding: 0.5rem 0.9rem;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-2);
        transition: top 0.15s ease;
    }

    .skip-link:focus {
        top: 0.5rem;
    }

    /* The repository the docs describe: mark plus owner/name. */
    .repo-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.6rem;
        color: var(--text-2);
        border-radius: var(--radius-sm);
        font-size: 0.8rem;
        font-weight: 500;
        min-width: 0;
    }

    .repo-link:hover { color: var(--text-1); background: var(--surface-2); }

    .repo-link-mark {
        width: 1rem;
        height: 1rem;
        flex: none;
    }

    .repo-link-stars {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
    }

    .repo-link-star {
        width: 0.85rem;
        height: 0.85rem;
        flex: none;
    }

    .repo-link-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .top-nav-link {
        padding: 0.35rem 0.6rem;
        color: var(--text-2);
        border-radius: var(--radius-sm);
        font-weight: 500;
    }

    .top-nav-link:hover {
        color: var(--text-1);
        background: var(--surface-2);
    }

    /*
     * Three columns: navigation, the document, and its table of contents.
     * The whole grid is centered so the text does not drift to one side
     * on a wide display.
     */
    .docs-layout {
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--toc-width);
        --toc-width: 14rem;
        align-items: start;
        max-width: 100rem;
        margin: 0 auto;
    }

    .sidebar {
        position: sticky;
        top: var(--topbar-height);
        height: calc(100vh - var(--topbar-height));
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 1.75rem 1rem 3rem 1.5rem;
        border-right: 1px solid var(--line);
    }

    .sidebar-header {
        margin-bottom: 1.25rem;
    }

    .sidebar-header h1 {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
    }

    /* The sidebar repeats the site name the bar already shows. */
    .top-nav ~ .docs-layout .sidebar-header {
        display: none;
    }

    .site-nav {
        font-size: 0.875rem;
    }

    .nav-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .nav-group {
        font-weight: 600;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-3);
        margin: 1.75rem 0 0.4rem;
        padding: 0 0.6rem;
    }

    .nav-group:first-child { margin-top: 0; }

    .nav-sep hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 1rem 0;
        background: none;
        height: 0;
    }

    .nav-item { margin: 0; }

    .nav-item a {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.32rem 0.6rem;
        color: var(--text-2);
        border-radius: var(--radius-sm);
        line-height: 1.45;
        transition: color 0.12s ease, background 0.12s ease;
    }

    /* Icons are sized here rather than in the file: an icon set carries
       its own pixel dimensions, which are stripped on the way in so the
       sidebar decides the size. Without a size the SVG would fill the
       line box. */
    .nav-icon {
        display: inline-flex;
        flex: none;
        width: 1em;
        height: 1em;
        /* The glyph belongs to its label: a paler icon beside a darker
           word reads as two lists rather than one. */
        color: inherit;
    }

    .nav-icon svg {
        width: 100%;
        height: 100%;
        stroke-width: 2;
    }

    .nav-item a:hover {
        color: var(--text-1);
        background: var(--surface-2);
    }

    .nav-item a.active {
        color: var(--accent);
        background: var(--accent-soft);
        font-weight: 550;
    }

    /* Nested items sit under a guide rule rather than deeper padding. */
    .nav-item .nav-list {
        margin: 0.15rem 0 0.15rem 0.6rem;
        border-left: 1px solid var(--line);
        padding-left: 0.4rem;
    }

    /*
     * The column is wider than a line of prose should be. Text is held
     * to --measure inside it; code, tables, and figures use the whole
     * width, because a wrapped command line is harder to read than a
     * long one and there is no reason to make them scroll while the
     * column sits half empty.
     *
     * Everything is left-aligned to the same edge. Centering each block
     * on its own would make that edge move whenever a wide element
     * appeared between two paragraphs.
     */
    .main-content {
        min-width: 0;
        /* width, not just max-width: auto inline margins on a grid item
           make it size to its content instead of filling the track. */
        width: 100%;
        max-width: calc(var(--measure) + 18rem);
        margin-inline: auto;
        padding: 3rem 3rem 6rem;
    }

    .main-content > * {
        max-width: var(--measure);
        margin-inline: 0;
    }

    .main-content > .md-code,
    .main-content > pre,
    .main-content > table,
    .main-content > figure,
    .main-content > .mermaid,
    .main-content > .table-wrapper {
        max-width: 100%;
    }

    .breadcrumb {
        font-size: 0.78rem;
        margin-bottom: 0.75rem;
        color: var(--text-3);
    }

    .breadcrumb ol {
        display: flex;
        flex-wrap: wrap;
        list-style: none;
        padding: 0;
        margin: 0;
        gap: 0.35rem;
    }

    .breadcrumb li {
        display: flex;
        align-items: center;
    }

    .breadcrumb li:not(:last-child)::after {
        content: '/';
        margin-left: 0.35rem;
        color: var(--line-strong);
    }

    .breadcrumb a { color: var(--text-3); }
    .breadcrumb a:hover { color: var(--text-1); }

    .breadcrumb li[aria-current="page"] {
        color: var(--text-2);
    }

    /* Previous and next page */
    .page-nav {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 4rem;
        padding-top: 2rem;
        border-top: 1px solid var(--line);
    }

    .page-nav a {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.85rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        min-width: 0;
        max-width: 48%;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .page-nav a:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-1);
    }

    .nav-prev { align-items: flex-start; }
    .nav-next { align-items: flex-end; margin-left: auto; text-align: right; }
    .nav-prev-empty { flex: 1; }

    .nav-label {
        font-size: 0.68rem;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    /* The label above it already says which way this goes; the title is
       a link, not a heading, so it does not need the weight or the ink
       of one. */
    .nav-title {
        font-size: 0.94rem;
        font-weight: 500;
        color: var(--text-2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
    }

    .page-nav a:hover .nav-title { color: var(--accent); }

    /* Page footer */
    .page-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-top: 2.5rem;
        font-size: 0.82rem;
        color: var(--text-3);
    }

    .edit-link a, .edit-link {
        color: var(--text-3);
    }

    .edit-link a:hover, .edit-link:hover {
        color: var(--accent);
    }

    /* "On this page" */
    .sidebar-toc {
        position: sticky;
        top: var(--topbar-height);
        height: calc(100vh - var(--topbar-height));
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 3rem 1.5rem 3rem 0.5rem;
        font-size: 0.8rem;
    }

    .sidebar-toc-header {
        font-weight: 600;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-3);
        margin-bottom: 0.6rem;
        padding-left: 0.75rem;
    }

    .sidebar-toc ul {
        list-style: none;
        padding: 0;
        margin: 0;
        border-left: 1px solid var(--line);
    }

    .sidebar-toc li { margin: 0; }

    .sidebar-toc a {
        display: block;
        padding: 0.25rem 0 0.25rem 0.75rem;
        margin-left: -1px;
        color: var(--text-2);
        border-left: 1px solid transparent;
        line-height: 1.45;
        transition: color 0.12s ease, border-color 0.12s ease;
    }

    .sidebar-toc a:hover { color: var(--text-1); }

    .sidebar-toc a.active {
        color: var(--accent);
        border-left-color: var(--accent);
    }

    .sidebar-toc a.level-1 { padding-left: 0.75rem; }
    .sidebar-toc a.level-2 { padding-left: 0.75rem; }
    .sidebar-toc a.level-3 { padding-left: 1.6rem; color: var(--text-3); }

    /* A page with too few headings has no rail; do not reserve room. */
    .docs-layout:has(.sidebar-toc[hidden]),
    .docs-layout:has(.sidebar-toc[style*="display: none"]) {
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar-toc[hidden] { display: none; }

    /* The inline table of contents duplicates the rail. */
    .docs-layout .main-content #toc-title,
    .docs-layout .main-content #toc {
        display: none;
    }

    @media (max-width: 1120px) {
        .docs-layout {
            grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        }
        .sidebar-toc { display: none; }
        .main-content { padding: 2.5rem 2.5rem 5rem; }
    }

    /*
     * Narrow windows: the sidebar becomes a drawer opened from the bar,
     * so the document starts at the top of the screen instead of below a
     * screenful of links.
     */
    @media (max-width: 900px) {
        .docs-layout,
        .docs-layout:has(.sidebar-toc[hidden]) {
            grid-template-columns: minmax(0, 1fr);
        }

        .nav-toggle { display: inline-flex; }

        /* No sidebar to line up with; the document's own gutter. */
        .top-nav {
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }

        .sidebar {
            position: fixed;
            top: var(--topbar-height);
            left: 0;
            z-index: 90;
            width: min(20rem, 84vw);
            height: calc(100vh - var(--topbar-height));
            background: var(--bg);
            border-right: 1px solid var(--line);
            box-shadow: var(--shadow-2);
            transform: translateX(-102%);
            transition: transform 0.18s ease;
        }

        .sidebar.open { transform: translateX(0); }

        .nav-backdrop {
            position: fixed;
            inset: var(--topbar-height) 0 0;
            z-index: 80;
            background: rgba(0, 0, 0, 0.35);
        }

        .main-content { padding: 2rem 1.25rem 4rem; }
    }

    @media (max-width: 600px) {
        .page-nav { flex-direction: column; }
        .page-nav a { max-width: 100%; }
        .nav-next { align-items: flex-start; text-align: left; }
    }

    /* Too narrow for three columns: the search returns to the right. */
    @media (max-width: 60rem) {
        .top-nav {
            display: flex;
            justify-content: space-between;
        }

        .top-nav-center { flex: 1; justify-content: flex-end; }
        .search-trigger { width: auto; max-width: 12rem; }
        .search-trigger-label { display: none; }
    }

    /*
     * A phone fits the site name and three controls, and not the words
     * beside them: at this width the name and the repository both
     * truncated to a few letters and a pair of ellipses, which say less
     * than the marks they sat next to. The controls become their glyphs,
     * and the name gets the room they gave up. The shortcut hint goes
     * with them — there is no key to press.
     */
    @media (max-width: 40rem) {
        .top-nav { gap: 0.4rem; }

        .search-trigger {
            flex: none;
            width: 2.25rem;
            justify-content: center;
            padding: 0;
        }

        .search-trigger kbd { display: none; }

        /* The live-reload light is for whoever is writing the page, and
           they are not reading it on a phone. Left in, it pushed the
           search off the end of the bar. */
        .connection-status { display: none; }

        .repo-link { padding: 0.35rem; }
        .repo-link-name,
        .repo-link-stars { display: none; }
    }
</style>
{{end}}
