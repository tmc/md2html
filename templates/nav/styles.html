{{define "nav-styles"}}
<style>
    /* Docs Layout with Sidebar */
    .docs-layout {
        display: flex;
        min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
        width: 280px;
        min-width: 280px;
        background: var(--bg-subtle);
        border-right: 1px solid var(--border);
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 24px 16px;
    }

    .sidebar-header {
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
        font-size: 18px;
        margin: 0;
        border: none;
        padding: 0;
    }

    /* Site Navigation */
    .site-nav {
        font-size: 14px;
    }

    .nav-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .nav-group {
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--fg-muted);
        margin: 20px 0 8px;
        padding: 0 8px;
    }

    .nav-group:first-child {
        margin-top: 0;
    }

    .nav-sep hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 16px 0;
    }

    .nav-item {
        margin: 2px 0;
    }

    .nav-item a {
        display: block;
        padding: 6px 12px;
        color: var(--fg);
        text-decoration: none;
        border-radius: 6px;
        transition: background 0.15s ease;
    }

    .nav-item a:hover {
        background: var(--border);
        text-decoration: none;
    }

    .nav-item a.active {
        background: var(--accent);
        color: white;
    }

    /* Nested nav items */
    .nav-item .nav-list {
        margin-left: 12px;
        border-left: 1px solid var(--border);
        padding-left: 0;
    }

    .nav-item.level-1 > a { padding-left: 24px; }
    .nav-item.level-2 > a { padding-left: 36px; }
    .nav-item.level-3 > a { padding-left: 48px; }

    /* Main content */
    .main-content {
        flex: 1;
        min-width: 0;
        padding: 45px;
        max-width: calc(100% - 280px);
    }

    /* Breadcrumb */
    .breadcrumb {
        font-size: 13px;
        margin-bottom: 24px;
    }

    .breadcrumb ol {
        display: flex;
        flex-wrap: wrap;
        list-style: none;
        padding: 0;
        margin: 0;
        gap: 4px;
    }

    .breadcrumb li {
        display: flex;
        align-items: center;
    }

    .breadcrumb li:not(:last-child)::after {
        content: '/';
        margin-left: 4px;
        color: var(--fg-muted);
    }

    .breadcrumb a {
        color: var(--fg-muted);
    }

    .breadcrumb a:hover {
        color: var(--accent);
    }

    .breadcrumb li[aria-current="page"] {
        color: var(--fg);
        font-weight: 500;
    }

    /* Page Navigation (prev/next) */
    .page-nav {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
    }

    .page-nav a {
        display: flex;
        flex-direction: column;
        padding: 16px 20px;
        border: 1px solid var(--border);
        border-radius: 8px;
        text-decoration: none;
        transition: border-color 0.15s ease, background 0.15s ease;
        min-width: 0;
        max-width: 45%;
    }

    .page-nav a:hover {
        border-color: var(--accent);
        background: var(--bg-subtle);
        text-decoration: none;
    }

    .nav-prev {
        align-items: flex-start;
    }

    .nav-next {
        align-items: flex-end;
        margin-left: auto;
    }

    .nav-prev-empty {
        flex: 1;
    }

    .nav-label {
        font-size: 12px;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }

    .nav-title {
        font-size: 16px;
        font-weight: 500;
        color: var(--accent);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Responsive */
    @media (max-width: 1024px) {
        .docs-layout {
            flex-direction: column;
        }

        .sidebar {
            width: 100%;
            min-width: 100%;
            height: auto;
            position: relative;
            border-right: none;
            border-bottom: 1px solid var(--border);
            padding: 16px;
        }

        .main-content {
            max-width: 100%;
            padding: 24px;
        }
    }

    @media (max-width: 600px) {
        .page-nav {
            flex-direction: column;
        }

        .page-nav a {
            max-width: 100%;
        }

        .nav-next {
            align-items: flex-start;
        }
    }
</style>
{{end}}
