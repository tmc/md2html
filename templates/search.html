{{define "search-modal"}}
<!-- Search Modal -->
<div id="search-overlay" class="search-overlay" style="display: none;">
    <div class="search-modal">
        <div class="search-header">
            <input type="text" id="search-input" class="search-input" placeholder="Search documentation..." autocomplete="off" />
            <button class="search-close" onclick="closeSearch()">&times;</button>
        </div>
        <div id="search-results" class="search-results">
            <div class="search-hint">
                Start typing to search...
            </div>
        </div>
        <div class="search-footer">
            <span class="search-shortcut">
                <kbd>⌘K</kbd> or <kbd>Ctrl+K</kbd> to open
            </span>
            <span class="search-shortcut">
                <kbd>↑</kbd> <kbd>↓</kbd> to navigate
            </span>
            <span class="search-shortcut">
                <kbd>Enter</kbd> to select
            </span>
            <span class="search-shortcut">
                <kbd>Esc</kbd> to close
            </span>
        </div>
    </div>
</div>
{{end}}

{{define "search-styles"}}
<style>
/* Search Overlay */
.search-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 10000;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10vh;
    animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Search Modal */
.search-modal {
    background: var(--bg, #ffffff);
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    width: 90%;
    max-width: 600px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    animation: slideDown 0.2s ease;
}

@media (prefers-color-scheme: dark) {
    .search-modal {
        background: var(--bg, #1a1a1a);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Search Header */
.search-header {
    display: flex;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--border, #e1e4e8);
}

.search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    background: transparent;
    color: var(--fg, #24292e);
}

@media (prefers-color-scheme: dark) {
    .search-input {
        color: var(--fg, #e6edf3);
    }
}

.search-close {
    background: none;
    border: none;
    font-size: 28px;
    color: var(--fg-muted, #6a737d);
    cursor: pointer;
    padding: 0;
    margin-left: 12px;
    line-height: 1;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
}

.search-close:hover {
    background: var(--bg-subtle, #f6f8fa);
}

/* Search Results */
.search-results {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.search-hint {
    padding: 32px;
    text-align: center;
    color: var(--fg-muted, #6a737d);
}

.search-result {
    padding: 12px 16px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 4px;
}

.search-result:hover, .search-result.selected {
    background: var(--bg-subtle, #f6f8fa);
}

@media (prefers-color-scheme: dark) {
    .search-result:hover, .search-result.selected {
        background: var(--bg-subtle, #161b22);
    }
}

.search-result-title {
    font-weight: 600;
    color: var(--fg, #24292e);
    margin-bottom: 4px;
}

@media (prefers-color-scheme: dark) {
    .search-result-title {
        color: var(--fg, #e6edf3);
    }
}

.search-result-title mark {
    background: var(--mark-bg, #fff3cd);
    color: var(--mark-fg, #000);
    padding: 1px 2px;
    border-radius: 2px;
}

.search-result-blurb {
    font-size: 14px;
    color: var(--fg-muted, #6a737d);
    margin-bottom: 4px;
    line-height: 1.4;
}

.search-result-blurb mark {
    background: var(--mark-bg, #fff3cd);
    color: var(--mark-fg, #000);
}

.search-result-meta {
    font-size: 12px;
    color: var(--fg-muted, #6a737d);
}

.search-result-category {
    display: inline-block;
    padding: 2px 6px;
    background: var(--bg-subtle, #f6f8fa);
    border-radius: 3px;
    font-size: 11px;
}

@media (prefers-color-scheme: dark) {
    .search-result-category {
        background: var(--bg-subtle, #161b22);
    }
}

.search-no-results {
    padding: 32px;
    text-align: center;
    color: var(--fg-muted, #6a737d);
}

/* Search Footer */
.search-footer {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 12px 16px;
    border-top: 1px solid var(--border, #e1e4e8);
    font-size: 12px;
    color: var(--fg-muted, #6a737d);
}

.search-shortcut {
    display: flex;
    gap: 4px;
    align-items: center;
}

.search-shortcut kbd {
    display: inline-block;
    padding: 2px 6px;
    font-family: monospace;
    font-size: 11px;
    background: var(--bg-subtle, #f6f8fa);
    border: 1px solid var(--border, #e1e4e8);
    border-radius: 3px;
    box-shadow: 0 1px 0 var(--border, #e1e4e8);
}

@media (prefers-color-scheme: dark) {
    .search-shortcut kbd {
        background: var(--bg-subtle, #161b22);
        border-color: var(--border, #30363d);
        box-shadow: 0 1px 0 var(--border, #30363d);
    }
}

@media (max-width: 640px) {
    .search-footer {
        flex-wrap: wrap;
    }

    .search-shortcut {
        font-size: 10px;
    }
}
</style>
{{end}}

{{define "search-scripts"}}
<script src="{{.AssetBase}}{{asset .Assets "js/minisearch.min.js"}}" defer></script>
<script src="{{.AssetBase}}{{asset .Assets "search-index.js"}}" defer></script>
<script src="{{.AssetBase}}{{asset .Assets "js/search.js"}}" defer></script>
{{end}}
