{{define "mermaid-scripts"}}
    {{template "asset-fallback" .}}
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"
            onerror="md2htmlAssetUnavailable('Mermaid', 'diagrams stay as source')"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof mermaid === 'undefined') {
                return; // loader failed; the onerror handler already reported it
            }

            const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            mermaid.initialize({
                startOnLoad: false,
                theme: isDarkMode ? 'dark' : 'default',
                securityLevel: 'loose',
                maxWidth: '100%',
                useMaxWidth: true,
                wrap: true
            });

            // Convert code blocks with language-mermaid to mermaid diagrams
            const mermaidBlocks = document.querySelectorAll('pre > code.language-mermaid');
            mermaidBlocks.forEach(async (block, index) => {
                const pre = block.parentElement;
                const graphDefinition = block.textContent;

                // Create a div for the mermaid diagram
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.id = 'mermaid-' + index;

                // Render the diagram
                try {
                    const { svg } = await mermaid.render('mermaid-svg-' + index, graphDefinition);
                    div.innerHTML = svg;
                    pre.replaceWith(div);
                } catch (error) {
                    console.error('Mermaid rendering error:', error);
                    // Keep the original code block if rendering fails
                }
            });
        });
    </script>
{{end}}
