{{define "mermaid-scripts"}}
    {{template "asset-fallback" .}}
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"
            onerror="md2htmlAssetUnavailable('Mermaid', 'diagrams stay as source')"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof mermaid === 'undefined') {
                return; // loader failed; the onerror handler already reported it
            }

            const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            // Drive mermaid's base theme from the page palette so diagrams
            // sit on the same surface as the rest of the page in both
            // color schemes.
            const styles = getComputedStyle(document.documentElement);
            const v = name => styles.getPropertyValue(name).trim();

            mermaid.initialize({
                startOnLoad: false,
                theme: 'base',
                securityLevel: 'loose',
                themeVariables: {
                    darkMode: isDarkMode,
                    background: v('--surface'),
                    primaryColor: v('--surface-2'),
                    primaryTextColor: v('--text-1'),
                    primaryBorderColor: v('--line-strong'),
                    secondaryColor: v('--surface-2'),
                    tertiaryColor: v('--surface'),
                    lineColor: v('--text-2'),
                    textColor: v('--text-1'),
                    clusterBkg: v('--surface-2'),
                    clusterBorder: v('--line'),
                    edgeLabelBackground: v('--surface'),
                    fontFamily: styles.fontFamily || 'inherit'
                },
                // Natural size plus a scrolling container beats scaling a
                // wide flowchart down to an illegible thumbnail.
                flowchart: { useMaxWidth: false },
                sequence: { useMaxWidth: false, wrap: true },
                journey: { useMaxWidth: false },
                timeline: { useMaxWidth: false }
            });

            // Convert code blocks with language-mermaid to mermaid diagrams
            const mermaidBlocks = document.querySelectorAll('pre > code.language-mermaid');
            mermaidBlocks.forEach(async (block, index) => {
                const pre = block.parentElement;
                const graphDefinition = block.textContent;

                // Create a div for the mermaid diagram
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.id = 'mermaid-' + index;

                // Render the diagram
                try {
                    const { svg } = await mermaid.render('mermaid-svg-' + index, graphDefinition);
                    div.innerHTML = svg;
                    pre.replaceWith(div);
                } catch (error) {
                    console.error('Mermaid rendering error:', error);
                    // Keep the original code block if rendering fails
                }
            });
        });
    </script>
{{end}}
