{{define "sidebar-toc-scripts"}}
    <script>
        (function() {
            const container = document.getElementById('sidebar-toc');
            if (!container) return;

            function build() {
                const headings = document.querySelectorAll('.main-content h1, .main-content h2, .main-content h3');

                // A page with barely any structure gains nothing from a
                // table of contents. Marking it hidden also lets the
                // layout reclaim the column.
                if (headings.length < 3) {
                    container.hidden = true;
                    return;
                }

                const list = document.createElement('ul');
                const links = new Map();

                headings.forEach((heading, index) => {
                    if (!heading.id) {
                        heading.id = `heading-${index}`;
                    }
                    const link = document.createElement('a');
                    link.href = `#${heading.id}`;
                    // Read the heading without the "#" self-link appended
                    // to it, whichever script ran first.
                    const label = heading.cloneNode(true);
                    label.querySelectorAll('.heading-anchor').forEach(el => el.remove());
                    link.textContent = label.textContent.trim();
                    link.className = `level-${heading.tagName.charAt(1)}`;

                    const item = document.createElement('li');
                    item.appendChild(link);
                    list.appendChild(item);
                    links.set(heading.id, link);
                });

                container.appendChild(list);

                function activate(id) {
                    links.forEach((link, key) => link.classList.toggle('active', key === id));
                }

                // Track the heading nearest the top of the viewport. An
                // observer reports only what crosses the boundary, so
                // scrolling costs nothing between section changes.
                const visible = new Set();
                const observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            visible.add(entry.target.id);
                        } else {
                            visible.delete(entry.target.id);
                        }
                    });
                    for (const heading of headings) {
                        if (visible.has(heading.id)) {
                            activate(heading.id);
                            return;
                        }
                    }
                }, {
                    // A band across the upper part of the viewport: the
                    // section being read, rather than the one scrolling
                    // out of sight at the bottom.
                    rootMargin: '-10% 0px -70% 0px',
                    threshold: 0,
                });
                headings.forEach(heading => observer.observe(heading));

                activate(headings[0].id);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', build);
            } else {
                build();
            }
        })();
    </script>
{{end}}
