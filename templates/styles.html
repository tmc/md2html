{{define "styles"}}
<style>
    /* Enable View Transitions API for smooth page navigation */
    @view-transition {
        navigation: auto;
    }

    /* Minimal GitHub-style CSS with light/dark mode support */
    :root {
        /* Core colors - Light mode */
        --fg: #24292e;
        --fg-muted: #6a737d;
        --bg: #ffffff;
        --bg-subtle: #f6f8fa;
        --border: #e1e4e8;
        --accent: #0366d6;

        /* Alert colors */
        --note: #0366d6;
        --note-bg: #f1f8ff;
        --success: #28a745;
        --success-bg: #f0fff4;
        --important: #6f42c1;
        --important-bg: #f5f0ff;
        --warning: #f9c513;
        --warning-bg: #fffbdd;
        --danger: #d73a49;
        --danger-bg: #ffeef0;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            /* Core colors - Dark mode */
            --fg: #e6edf3;
            --fg-muted: #7d8590;
            --bg: #0d1117;
            --bg-subtle: #161b22;
            --border: #30363d;
            --accent: #58a6ff;

            /* Alert colors */
            --note: #2f81f7;
            --note-bg: rgba(56, 139, 253, 0.1);
            --success: #3fb950;
            --success-bg: rgba(46, 160, 67, 0.1);
            --important: #a371f7;
            --important-bg: rgba(163, 113, 247, 0.1);
            --warning: #d29922;
            --warning-bg: rgba(187, 128, 9, 0.1);
            --danger: #f85149;
            --danger-bg: rgba(248, 81, 73, 0.1);
        }
    }

    /* Base styles */
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        max-width: 980px;
        margin: 0 auto;
        padding: 45px;
        color: var(--fg);
        background: var(--bg);
    }

    @media (max-width: 767px) {
        body { padding: 15px; }
    }

    /* Headings */
    h1, h2, h3, h4, h5, h6 {
        margin-top: 24px;
        margin-bottom: 16px;
        font-weight: 600;
        line-height: 1.25;
    }

    h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    h3 { font-size: 1.25em; }
    h4 { font-size: 1em; }
    h5 { font-size: .875em; }
    h6 { font-size: .85em; color: var(--fg-muted); }

    /* Text elements */
    p { margin: 0 0 16px; }

    a {
        color: var(--accent);
        text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    code {
        padding: .2em .4em;
        margin: 0;
        font-size: 85%;
        background: rgba(175, 184, 193, 0.2);
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    pre {
        padding: 16px;
        overflow: auto;
        font-size: 85%;
        line-height: 1.45;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 6px;
    }

    pre code {
        display: inline;
        padding: 0;
        margin: 0;
        background: transparent;
        border: 0;
        font-size: 100%;
    }

    blockquote {
        padding: 0 1em;
        color: var(--fg-muted);
        border-left: .25em solid var(--border);
        margin: 0 0 16px 0;
    }

    blockquote > :first-child { margin-top: 0; }
    blockquote > :last-child { margin-bottom: 0; }

    /* Tables */
    table {
        display: block;
        width: 100%;
        overflow: auto;
        border-spacing: 0;
        border-collapse: collapse;
        margin-bottom: 16px;
    }

    th { font-weight: 600; }

    th, td {
        padding: 6px 13px;
        border: 1px solid var(--border);
    }

    tr { background: var(--bg); }
    tr:nth-child(2n) { background: var(--bg-subtle); }

    /* Lists */
    ul, ol {
        padding-left: 2em;
        margin: 0 0 16px;
    }

    li > p { margin-top: 16px; }

    li:has(> input[type="checkbox"][disabled]:first-child) {
        list-style-type: none;
    }

    li > input[type="checkbox"][disabled]:first-child {
        -webkit-appearance: none;
        appearance: none;
        box-sizing: border-box;
        display: inline-grid;
        place-content: center;
        width: 1em;
        height: 1em;
        margin: 0 .2em .25em -1.4em;
        vertical-align: middle;
        background: var(--bg);
        border: 2px solid var(--fg-muted);
        border-radius: 3px;
        cursor: default;
        opacity: 1;
    }

    li > input[type="checkbox"][disabled]:first-child:checked {
        background: var(--accent);
        border-color: var(--accent);
    }

    li > input[type="checkbox"][disabled]:first-child:checked::before {
        content: "";
        width: .55em;
        height: .55em;
        background: white;
        clip-path: polygon(14% 44%, 0 59%, 41% 100%, 100% 21%, 86% 7%, 38% 67%);
    }

    hr {
        height: .25em;
        padding: 0;
        margin: 24px 0;
        background: var(--border);
        border: 0;
    }

    img { max-width: 100%; }

    /* Responsive Mermaid diagrams */
    .mermaid {
        max-width: 100%;
        overflow-x: auto;
        margin: 16px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px;
        background: var(--bg-subtle);
    }

    .mermaid svg {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
    }

    /* GitHub Alerts (admonitions) */
    .admonition {
        padding: 1em;
        margin: 16px 0;
        border-left: .25em solid;
        border-radius: 6px;
    }

    .admonition > :first-child { margin-top: 0; }
    .admonition > :last-child { margin-bottom: 0; }

    .adm-note {
        border-left-color: var(--note);
        background: var(--note-bg);
    }

    .adm-tip {
        border-left-color: var(--success);
        background: var(--success-bg);
    }

    .adm-important {
        border-left-color: var(--important);
        background: var(--important-bg);
    }

    .adm-warning {
        border-left-color: var(--warning);
        background: var(--warning-bg);
    }

    .adm-danger, .adm-caution {
        border-left-color: var(--danger);
        background: var(--danger-bg);
    }

    /* Header bar */
    .header-bar {
        position: fixed;
        top: 0;
        right: 0;
        display: flex;
        gap: 16px;
        padding: 8px 16px;
        z-index: 1000;
    }

    /* Live reload indicator */
    .connection-status {
        background: var(--success);
        color: white;
        padding: 4px 8px;
        border-radius: 3px;
        font-size: 12px;
    }

    .connection-status.disconnected {
        background: var(--danger);
    }

    /* Version selector */
    .version-selector {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-subtle);
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 12px;
    }

    .version-selector label {
        margin: 0;
        color: var(--fg-muted);
        font-weight: 600;
    }

    .version-selector select {
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 4px;
        font-size: 12px;
        cursor: pointer;
    }

    .version-selector select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    /* View Transition animations */
    ::view-transition-old(root),
    ::view-transition-new(root) {
        animation-duration: 0.3s;
    }

    ::view-transition-old(root) {
        animation-name: fade-out;
    }

    ::view-transition-new(root) {
        animation-name: fade-in;
    }

    @keyframes fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
    }

    @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .md-jsonspec {
        position: relative;
    }
    .md-jsonspec-badge {
        display: inline-block;
        font-size: 12px;
        padding: 2px 8px;
        margin-bottom: 6px;
        border: 1px solid var(--border, #d0d7de);
        border-radius: 999px;
        color: var(--fg-muted, #656d76);
        text-decoration: none;
        background: var(--bg, transparent);
    }
    .md-jsonspec-badge:hover {
        color: var(--accent, #0969da);
        border-color: var(--accent, #0969da);
        text-decoration: none;
    }
    .md-jsonspec-key {
        cursor: help;
        border-bottom: 1px dotted var(--fg-muted, #656d76);
    }
    .md-jsonspec-key.md-jsonspec-required {
        border-bottom-style: solid;
    }
    .md-jsonspec-enum {
        cursor: help;
        border-bottom: 1px dotted var(--fg-muted, #656d76);
    }

    {{.CustomCSS}}
    {{.ChromaCSS}}
</style>
{{end}}

{{define "status-styles"}}{{end}}
